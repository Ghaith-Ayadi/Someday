<!--
  Paste this into Supabase → Authentication → Email Templates → Magic Link.
  Template variables: {{ .ConfirmationURL }}, {{ .Token }}, {{ .Email }}.
-->
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f7f7f8;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <tr>
    <td align="center">
      <table width="480" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #eceef0;border-radius:12px;padding:32px;">
        <tr>
          <td align="center" style="padding-bottom:20px;">
            <img src="https://someday-watchlist.vercel.app/icons/icon-192.png" width="56" height="56" alt="Someday" style="display:block;border-radius:12px;" />
          </td>
        </tr>
        <tr>
          <td align="center" style="font-size:20px;font-weight:600;color:#0a0a0b;padding-bottom:8px;">
            Sign in to Someday
          </td>
        </tr>
        <tr>
          <td align="center" style="font-size:14px;line-height:1.5;color:#585c64;padding-bottom:24px;">
            On your computer, tap the button below. On your phone, enter the code in the app.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:28px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#2e90fa;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:10px 20px;border-radius:8px;">
              Sign in on this device
            </a>
          </td>
        </tr>
        <tr>
          <td align="center" style="font-size:12px;color:#8a8f98;padding-bottom:8px;letter-spacing:0.02em;text-transform:uppercase;">
            Or enter this code
          </td>
        </tr>
        <tr>
          <td align="center" style="font-size:28px;font-weight:700;color:#0a0a0b;letter-spacing:6px;padding-bottom:24px;font-family:'SF Mono',Menlo,Consolas,monospace;">
            {{ .Token }}
          </td>
        </tr>
        <tr>
          <td align="center" style="font-size:12px;line-height:1.5;color:#8a8f98;border-top:1px solid #eceef0;padding-top:20px;">
            If you didn't request this email, you can safely ignore it. The code expires in 1 hour.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
